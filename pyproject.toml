[project]
name = "task-1"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "black==26.5.1",
    "click==8.5.0",
    "contourpy==1.3.3",
    "cycler==0.12.1",
    "flake8==7.3.0",
    "fonttools==4.64.0",
    "isort==9.0.1",
    "kiwisolver==1.5.1",
    "matplotlib==3.11.1",
    "mccabe==0.7.0",
    "mypy-extensions==1.1.0",
    "networkx==3.6.1",
    "numpy==2.5.2",
    "packaging==26.3",
    "pathspec==1.1.1",
    "pillow==12.3.0",
    "platformdirs==4.11.7",
    "profilehooks==1.13.0",
    "pycodestyle==2.14.0",
    "pyflakes==3.4.0",
    "pyparsing==3.3.2",
    "pyqt6-qt6==6.11.2",
    "pyqt6==6.11.0",
    "pyqt6-sip==13.12.0",
    "python-dateutil==2.9.0.post0",
    "pytokens==0.4.1",
    "scipy==1.18.1",
    "six==1.17.0",
    "strenum==0.4.15",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 88
indent-width = 4
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    ".mypy_cache",
    ".ruff_cache",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes

    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "C90",    # mccabe (complexity)
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
    "T20",    # flake8-print (запрет print в продакшене)
    "PT",     # flake8-pytest-style
    "RET",    # flake8-return
    "ARG",    # flake8-unused-arguments
    "PTH",    # flake8-use-pathlib
    "ERA",    # eradicate (закомментированный код)
    "PL",     # pylint (часть правил)
    "RUF",    # ruff-specific rules

    "I",      # isort
]

ignore = [
    "E501",
    "B008",
    "PLR0913",
    "PLR2004",
    "RUF002",
    "RUF001",
    "T201"
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.isort]
combine-as-imports = true
force-wrap-aliases = true
known-first-party = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
